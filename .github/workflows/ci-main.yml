name: CI Main + Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  ci-sast-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SAST - audit de dependências
      - run: npm audit --audit-level=high || true

      # Gerar versão automática vYYYY.major.minor
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date +'%Y')
          LAST_TAG=$(git tag -l "v${YEAR}.*" --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="v${YEAR}.1.0"
          else
            MAJOR=$(echo "$LAST_TAG" | cut -d. -f2)
            VERSION="v${YEAR}.$((MAJOR + 1)).0"
          fi
          git tag "$VERSION"
          git push origin "$VERSION"
